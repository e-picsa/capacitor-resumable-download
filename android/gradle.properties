# DUAL-COMPATIBILITY NOTICE (Capacitor 8 & Capacitor 9):
# android.suppressUnsupportedCompileSdk suppresses AGP 8 warnings/errors when compiling
# with compileSdk 36 or 37 in local environments before upgrading AGP.
android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=36,37

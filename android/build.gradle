buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply from: 'variables.gradle'

android {
    namespace "io.picsa.plugins.download"

    // DUAL-COMPATIBILITY NOTICE (Capacitor 8 & Capacitor 9):
    // Fallback defaults to compileSdk 37 for Capacitor 9, while allowing Capacitor 8 host
    // apps to supply rootProject.ext.compileSdkVersion = 35/36.
    compileSdk safeExtGet('compileSdkVersion', 37)

    defaultConfig {
        // DUAL-COMPATIBILITY NOTICE:
        // DO NOT increase or hardcode minSdk to 26!
        // Capacitor 8 host apps compile with minSdkVersion = 24.
        // Capacitor 9 host apps supply rootProject.ext.minSdkVersion = 26.
        // safeExtGet allows the consuming app's root project to determine minSdk.
        minSdk safeExtGet('minSdkVersion', 24)

        // DUAL-COMPATIBILITY NOTICE:
        // targetSdk is intentionally omitted. AGP 9 infers targetSdk from compileSdk,
        // and targetSdk has no runtime effect on library AARs.

        // DUAL-COMPATIBILITY NOTICE:
        // Ships consumer keep rules for R8 optimization in Capacitor 9 release builds
        // without affecting Capacitor 8 release builds.
        consumerProguardFiles "proguard-rules.pro"

        versionCode 1
        versionName "0.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = false
    }

    lint {
        abortOnError true
        warningsAsErrors false
        checkDependencies false
        textReport true
    }
}

subprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('com.android.library')) {
            p.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}

dependencies {
    if (findProject(':capacitor-android') != null) {
        implementation project(':capacitor-android')
    }

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // DUAL-COMPATIBILITY NOTICE:
    // Migrated from androidx.core:core-ktx to androidx.core:core (Cap 9 recommendation).
    // The version is resolved dynamically via $androidxCoreVersion from variables.gradle
    // so Capacitor 8 apps use <= 1.17.0 while Capacitor 9 apps resolve to 1.19.0+.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.work:work-runtime-ktx:$androidxWorkVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "org.json:json:20240303"

    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"
}

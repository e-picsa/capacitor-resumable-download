name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - 'docs/**'
      - '.gitignore'
      - '.prettierignore'
      - '.editorconfig'
      - '.pr_agent.toml'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - 'docs/**'
      - '.gitignore'
      - '.prettierignore'
      - '.editorconfig'
      - '.pr_agent.toml'
      - 'LICENSE'

jobs:
  lint-and-build:
    name: Lint & Build JS/TS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint formatting
        run: yarn lint

      - name: Build plugin
        run: yarn build

      - name: Build example-app
        run: |
          cd example-app
          yarn install --frozen-lockfile
          yarn build

  test-android:
    name: Android Lint & Unit Tests (MockWebServer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run Android Lint (SDK 24-35 compatibility)
        run: ./gradlew :lintDebug
        working-directory: android

      - name: Run Android JVM Unit Tests
        run: ./gradlew test
        working-directory: android

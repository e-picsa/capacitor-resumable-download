name: E2E Android

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - 'docs/**'
      - '.gitignore'
      - '.prettierignore'
      - '.prettierrc'
      - '.editorconfig'
      - '.pr_agent.toml'
      - 'LICENSE'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - 'scripts/verify-cdn.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pr-agent.yml'
      - '.github/workflows/pr-preview.yml'
      - '.github/workflows/release-please.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - 'docs/**'
      - '.gitignore'
      - '.prettierignore'
      - '.prettierrc'
      - '.editorconfig'
      - '.pr_agent.toml'
      - 'LICENSE'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - 'scripts/verify-cdn.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pr-agent.yml'
      - '.github/workflows/pr-preview.yml'
      - '.github/workflows/release-please.yml'
  workflow_dispatch:

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-emulator:
    name: Android E2E Tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install example-app dependencies
        run: |
          cd example-app
          yarn install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: |
          chmod +x android/gradlew
          chmod +x example-app/android/gradlew

      - name: Build plugin and demo app APK
        run: yarn demo:build

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 8
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: yarn test:e2e --skip-build

      - name: Archive test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-failure-logs
          path: |
            /tmp/e2e-logcat.txt
            example-app/android/app/build/reports/
          if-no-files-found: ignore
